[project]
name = "telecom-churn-insight-assistant"
version = "1.0.0"
description = "AI-assisted Telecom Customer Churn Insight Assistant built with LangGraph and Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "langchain-ollama>=0.2.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "streamlit>=1.41.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"
